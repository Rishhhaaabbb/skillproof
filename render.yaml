services:
  - type: web
    name: skillproof-api
    runtime: python
    region: oregon          # free-tier region; change to singapore if your users are in Asia
    plan: free
    rootDir: skillproof-backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Render free tier spins down after 15 min of inactivity.
    # The /health endpoint keeps it warm when hit by the GitHub Actions cron.
    healthCheckPath: /health

    envVars:
      # --- Set these in the Render dashboard under "Environment" ---
      # Do NOT commit real values here; this file is committed to git.

      - key: GITHUB_TOKEN
        sync: false           # "sync: false" means Render will ask you for the value

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash-lite

      - key: DATABASE_URL
        sync: false           # paste your Supabase PostgreSQL URL

      - key: JWT_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: SCHEDULER_SECRET
        sync: false

      # Set this to your exact Vercel deployment URL, e.g.:
      # https://skillproof.vercel.app
      # Multiple origins: https://skillproof.vercel.app,https://www.skillproof.app
      - key: CORS_ORIGINS
        sync: false

      - key: USE_LLM_MOCK
        value: "false"

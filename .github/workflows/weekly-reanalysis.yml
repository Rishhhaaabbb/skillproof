name: Weekly Re-analysis

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}  # Allow manual trigger from GitHub UI

# Required GitHub Actions secrets (set in repo Settings → Secrets → Actions):
#   BACKEND_URL       — e.g. https://skillproof-api.onrender.com   (no trailing slash)
#   SCHEDULER_SECRET  — same value as the backend SCHEDULER_SECRET env var

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Wake the Render free-tier service before hitting the API.
  #    Free tier spins down after 15 min of inactivity; the first
  #    request can take ~30 s to cold-start, so we warm it first.
  # ─────────────────────────────────────────────────────────────
  warm-up:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint to wake Render service
        run: |
          echo "Waking Render service..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "${{ secrets.BACKEND_URL }}/health" || echo "000")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Service is up."
              exit 0
            fi
            sleep 15
          done
          echo "Service did not respond after 5 attempts — continuing anyway."

  # ─────────────────────────────────────────────────────────────
  # 2. Run the weekly re-analysis once the service is warm.
  # ─────────────────────────────────────────────────────────────
  trigger:
    runs-on: ubuntu-latest
    needs: warm-up
    steps:
      - name: Trigger weekly re-analysis
        run: |
          curl -X POST \
            "${{ secrets.BACKEND_URL }}/api/internal/run-weekly-reanalysis" \
            -H "X-Scheduler-Secret: ${{ secrets.SCHEDULER_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 \
            --retry 2 \
            --retry-delay 10 \
            --retry-connrefused \
            --fail \
            --show-error
